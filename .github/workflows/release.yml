name: release
on:
  push:
    tags: 'r*'
jobs:
  build-nrf:
    uses: ./.github/workflows/build-nrf.yml
  build-rp2040:
    uses: ./.github/workflows/build-rp2040.yml
  create-release:
    needs: [ build-nrf, build-rp2040 ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: download
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" download/*
